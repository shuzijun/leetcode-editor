name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run release quality gate
        run: ./gradlew qualityGate --no-daemon --stacktrace
        env:
          LD_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload quality gate reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-gate-reports-${{ steps.version.outputs.version }}
          path: |
            build/reports/
            build/test-results/
            out/ide-tests/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish the plugin
        run: ./gradlew publishPlugin --no-daemon --stacktrace
        env:
          LD_VERSION: ${{ steps.version.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: build/distributions/leetcode-editor-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
