<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{service}}resources/vditor/dist/index.css?{{serverToken}}"/>
    <link rel="stylesheet" href="{{service}}resources/vditor/style.css?{{serverToken}}"/>
</head>
<body className="body" style="margin-top: 5px;">
<div id="vditor" className="vditor vditor--fullscreen" data-render-mode="{{renderMode}}" style="height: 100%;padding-left: 5%;padding-right: 5%;"></div>
<textarea id="fileValue" style="display:none;">
{{fileValue}}
</textarea>
<script>
    const vditorCDN = "{{service}}resources/vditor";
    const vditorThemeCDN = "{{service}}resources/vditor/dist/css/content-theme";
    const darcula = "{{darcula}}" == "true";
    const vditorMethodUrl = vditorCDN + "/dist/method.min.js?{{serverToken}}";

    const previewElement = document.getElementById("vditor");
    let vditorPromise;

    function loadVditor() {
        if (typeof Vditor !== "undefined") {
            return Promise.resolve(Vditor);
        }
        if (!vditorPromise) {
            vditorPromise = new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = vditorMethodUrl;
                script.onload = () => resolve(Vditor);
                script.onerror = () => reject(new Error("Unable to load Vditor preview methods"));
                document.head.appendChild(script);
            });
        }
        return vditorPromise;
    }

    function reportVisualStable() {
        let quietTimer;
        let completed = false;
        const startedAt = performance.now();
        const observer = new MutationObserver(scheduleCheck);

        function imagesComplete() {
            return Array.from(previewElement.querySelectorAll("img")).every(image => image.complete);
        }

        function finish() {
            if (completed) {
                return;
            }
            completed = true;
            clearTimeout(quietTimer);
            observer.disconnect();
            {{previewStable}};
        }

        function scheduleCheck() {
            clearTimeout(quietTimer);
            quietTimer = setTimeout(() => {
                if (imagesComplete() || performance.now() - startedAt >= 3000) {
                    finish();
                } else {
                    previewElement.querySelectorAll("img").forEach(image => {
                        image.addEventListener("load", scheduleCheck, {once: true});
                        image.addEventListener("error", scheduleCheck, {once: true});
                    });
                }
            }, 200);
        }

        observer.observe(previewElement, {subtree: true, childList: true, attributes: true});
        setTimeout(finish, 3000);
        scheduleCheck();
    }

    function renderPreview() {
        loadVditor()
            .then(Vditor => {
                return Vditor.preview(previewElement,document.getElementById("fileValue").value,{
                "mode":  darcula ? "dark" : "light",
                "hljs": {"style": darcula ? "dracula" : "github"},
                "math": {
                    "inlineDigit": true
                },
                "cdn": vditorCDN,
                "markdown": {
                    "sanitize": false,
                },
                "theme": {
                    "current": darcula ? "idea-dark" : "idea-light",
                    "path": vditorThemeCDN
                },
                "after": function () {
                    {{previewReady}};
                    reportVisualStable();
                }
                });
            })
            .catch(function (error) {
                console.error("Unable to render question preview", error);
                {{previewError}};
            });
    }

    if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", () => {
            renderPreview();
        }, {once: true});
    } else {
        renderPreview();
    }

    function updateStyle(style,darcula){
        let newStyle = document.createElement('style');
        newStyle.id = 'ideaStyle';
        newStyle.innerHTML = style;
        let oldStyle = document.getElementById('ideaStyle');
        oldStyle.parentNode.replaceChild(newStyle,oldStyle);
        if (darcula) {
            document.getElementById("vditor").classList.add("vditor--dark");
        } else {
            document.getElementById("vditor").classList.remove("vditor--dark");
        }
        if (typeof Vditor !== "undefined") {
            Vditor.setContentTheme(darcula ? "idea-dark" : "idea-light",vditorThemeCDN)
            Vditor.setCodeTheme(darcula ? "dracula" : "github",vditorCDN)
        }
    }
</script>
{{ideStyle}}
</body>
</html>
