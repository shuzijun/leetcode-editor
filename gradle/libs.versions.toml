[versions]
# libraries
junit = "4.13.2"
junitJupiter = "5.12.2"
opentest4j = "1.3.0"
kodein = "7.22.0"
kotlinxCoroutines = "1.10.2"
kotlinStdlib = "2.4.0"
teamcityServiceMessages = "2024.07"
lcSdk = "0.0.4-rc.4"
fastjsonLegacy = "1.2.83_noneautotype"
jsoup = "1.23.1"
sentry = "8.52.0"
commonsLang3 = "3.18.0"
flexmark = "0.62.2"
tinyPinyin = "2.0.3.RELEASE"

# plugins
changelog = "2.4.0"
intelliJPlatform = "2.18.1"
kotlin = "2.3.21"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
kodein = { group = "org.kodein.di", name = "kodein-di-jvm", version.ref = "kodein" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "kotlinxCoroutines" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
teamcity-service-messages = { group = "org.jetbrains.teamcity", name = "serviceMessages", version.ref = "teamcityServiceMessages" }
lc-sdk = { group = "com.shuzijun", name = "lc-sdk", version.ref = "lcSdk" }
fastjson-legacy = { group = "com.alibaba", name = "fastjson", version.ref = "fastjsonLegacy" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
sentry = { group = "io.sentry", name = "sentry", version.ref = "sentry" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
flexmark = { group = "com.vladsch.flexmark", name = "flexmark", version.ref = "flexmark" }
flexmark-ext-attributes = { group = "com.vladsch.flexmark", name = "flexmark-ext-attributes", version.ref = "flexmark" }
tiny-pinyin = { group = "io.github.biezhi", name = "TinyPinyin", version.ref = "tinyPinyin" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
