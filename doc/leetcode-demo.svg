    <style>
      .select { animation: select 5s ease-in-out infinite; }
      .cursor { animation: blink 1s step-end infinite; }
      .console { animation: console 5s ease-in-out infinite; }
      .status-dot { animation: status-dot 2s ease-in-out infinite; }
      .feature-tag { animation: feature-tag 10s ease-in-out infinite; }
      .feature-tag-text { animation: feature-tag-text 10s ease-in-out infinite; }
      .feature-tag:nth-of-type(2) { animation-delay:-8s; }
      .feature-tag:nth-of-type(3) { animation-delay:-6s; }
      .feature-tag:nth-of-type(4) { animation-delay:-4s; }
      .feature-tag:nth-of-type(5) { animation-delay:-2s; }
      .feature-tag-text:nth-of-type(2) { animation-delay:-8s; }
      .feature-tag-text:nth-of-type(3) { animation-delay:-6s; }
      .feature-tag-text:nth-of-type(4) { animation-delay:-4s; }
      .feature-tag-text:nth-of-type(5) { animation-delay:-2s; }
      @keyframes select { 0%,100% { fill:#295a9f; } 50% { fill:#3673c1; } }
      @keyframes blink { 0%,46% { opacity:1; } 47%,100% { opacity:0; } }
      @keyframes console { 0%,42% { opacity:.32; } 56%,100% { opacity:1; } }
      @keyframes status-dot { 0%,100% { opacity:.5; } 50% { opacity:1; } }
      @keyframes feature-tag { 0%,18% { fill:#1d3b57; stroke:#346b9c; } 25%,100% { fill:#292d32; stroke:#454b54; } }
      @keyframes feature-tag-text { 0%,18% { fill:#c9e5ff; } 25%,100% { fill:#d1d9e2; } }
      @media (prefers-reduced-motion:reduce) { .select,.cursor,.console,.status-dot,.feature-tag,.feature-tag-text { animation:none; } }
    </style>
