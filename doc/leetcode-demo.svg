      <line x1="741" y1="116" x2="741" y2="486" stroke="#34373b"/><g font-family="Arial,sans-serif"><text x="411" y="150" fill="#e6edf5" font-size="18" font-weight="700">1. Two Sum</text><rect x="412" y="162" width="42" height="19" rx="9" fill="#295c37"/><text x="422" y="176" fill="#8cdb96" font-size="11">Easy</text><text x="467" y="176" fill="#9aa6b2" font-size="12">Array  ·  Hash Table</text><text x="411" y="211" fill="#c5cdd7" font-size="13">Given nums and a target, return the indices</text><text x="411" y="234" fill="#c5cdd7" font-size="13">of two values that add up to the target.</text><text x="411" y="257" fill="#c5cdd7" font-size="13">Each input has exactly one solution.</text><text x="411" y="301" fill="#eef2f7" font-size="14" font-weight="700">Example 1:</text><rect x="411" y="313" width="296" height="80" rx="4" fill="#282b30"/><text x="425" y="336" fill="#c9d0d9" font-size="12" font-family="monospace">Input: nums = [2,7,11,15], target = 9</text><text x="425" y="360" fill="#c9d0d9" font-size="12" font-family="monospace">Output: [0,1]</text><text x="425" y="384" fill="#c9d0d9" font-size="12" font-family="monospace">Explanation: nums[0] + nums[1] == 9</text></g>
      <g font-family="monospace" font-size="13"><text x="758" y="143" fill="#737b86">1</text><text x="780" y="143" fill="#85909d">// @leetcode submit region begin</text><text x="758" y="166" fill="#737b86">2</text><text x="780" y="166" fill="#c886e8">class</text><text x="820" y="166" fill="#d7dee8"> Solution {</text><text x="758" y="189" fill="#737b86">3</text><text x="780" y="189" fill="#5db4f5">  public int[]</text><text x="873" y="189" fill="#d7dee8"> twoSum(int[] nums, int target) {</text><text x="758" y="212" fill="#737b86">4</text><text x="780" y="212" fill="#d7dee8">    return new int[] {0, 1};</text><text x="758" y="235" fill="#737b86">5</text><text x="780" y="235" fill="#d7dee8">  }</text><text x="758" y="258" fill="#737b86">6</text><text x="780" y="258" fill="#d7dee8">}</text><rect class="cursor" x="798" y="242" width="7" height="16" fill="#efc461"/></g>
