      </g>
    </symbol>
    <style>
      .configuration { animation: configuration 15s ease-in-out infinite; }
      .generated { animation: generated 15s ease-in-out infinite; }
      .debug-menu { animation: debug-menu 15s ease-in-out infinite; }
      .run-result { animation: run-result 15s ease-in-out infinite; }
      .progress-one { animation: progress-one 15s ease-in-out infinite; }
      .progress-two { animation: progress-two 15s ease-in-out infinite; }
      .progress-three { animation: progress-three 15s ease-in-out infinite; }
      @keyframes configuration { 0%,4% { opacity:0; } 6%,28% { opacity:1; } 31%,100% { opacity:0; } }
      @keyframes generated { 0%,33% { opacity:.28; } 36%,61% { opacity:1; } 64%,100% { opacity:.38; } }
      @keyframes debug-menu { 0%,67% { opacity:0; } 70%,95% { opacity:1; } 98%,100% { opacity:0; } }
      @keyframes run-result { 0%,80% { opacity:0; } 84%,95% { opacity:1; } 98%,100% { opacity:0; } }
      @keyframes progress-one { 0%,4% { opacity:0; } 6%,28% { opacity:1; } 31%,100% { opacity:.34; } }
      @keyframes progress-two { 0%,33% { opacity:0; } 36%,61% { opacity:1; } 64%,100% { opacity:.34; } }
      @keyframes progress-three { 0%,69% { opacity:0; } 71%,95% { opacity:1; } 98%,100% { opacity:0; } }
      @media (prefers-reduced-motion:reduce) { .configuration,.generated,.debug-menu,.run-result,.progress-one,.progress-two,.progress-three { animation:none; } }
    </style>
