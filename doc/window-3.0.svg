    <style>
      .hint { animation: hint 26s steps(1,end) infinite; }
      .hint-logout { animation-delay:-24s; }
      .hint-refresh { animation-delay:-22s; }
      .hint-random { animation-delay:-20s; }
      .hint-filter { animation-delay:-18s; }
      .hint-session { animation-delay:-16s; }
      .hint-toggle { animation-delay:-14s; }
      .hint-settings { animation-delay:-12s; }
      .hint-clear { animation-delay:-10s; }
      .hint-help { animation-delay:-8s; }
      .hint-search { animation-delay:-6s; }
      .hint-category { animation-delay:-4s; }
      .hint-sort { animation-delay:-2s; }
      @keyframes hint { 0%,7% { opacity:1; } 8%,100% { opacity:0; } }
      @media (prefers-reduced-motion:reduce) { .hint { animation:none; } .hint:not(.hint-login) { display:none; } }
    </style>
