    <style>
      .hint { animation: hint 32s steps(1,end) infinite; }
      .h-solution { animation-delay:-30s; } .h-submissions { animation-delay:-28s; } .h-note { animation-delay:-26s; }
      .h-question { animation-delay:-24s; } .h-open-content { animation-delay:-22s; } .h-open-solution { animation-delay:-20s; } .h-web { animation-delay:-18s; }
      .h-submit { animation-delay:-16s; } .h-history { animation-delay:-14s; } .h-run { animation-delay:-12s; } .h-testcase { animation-delay:-10s; }
      .h-favorite { animation-delay:-8s; } .h-menu-note { animation-delay:-6s; } .h-timer { animation-delay:-4s; } .h-clear { animation-delay:-2s; }
      @keyframes hint { 0%,5% { opacity:1; } 6%,100% { opacity:0; } }
      @media (prefers-reduced-motion:reduce) {
        .hint { animation:none; }
        .hint:not(.h-content) { display:none; }
      }
    </style>
