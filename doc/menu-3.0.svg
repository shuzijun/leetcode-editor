    <rect x="28" y="98" width="560" height="41" fill="#292b2f"/>
    <rect x="800" y="98" width="372" height="41" fill="#292b2f"/>
    <g fill="#c5ccd5" font-family="Arial,sans-serif" font-size="14"><text x="50" y="124">Status</text><text x="98" y="124">Title</text><text x="520" y="124">Difficulty</text><text x="812" y="124">Content</text><text x="879" y="124">Solution</text><text x="951" y="124">Submissions</text><text x="1051" y="124">Note</text></g>
    <rect x="28" y="139" width="560" height="31" fill="#29436c"/>
    <g fill="#c3cad2" font-family="Arial,sans-serif" font-size="15">
      <text x="50" y="160">✓</text><text x="84" y="160">[1] Two Sum</text><text x="510" y="160">Easy</text>
      <text x="84" y="195">[2] Add Two Numbers</text><text x="84" y="230">[3] Longest Substring</text><text x="84" y="265">[4] Median of Two Sorted Arrays</text><text x="84" y="300">[5] Longest Palindromic Substring</text>
    </g>
    <g fill="#b8c0cb" font-family="Consolas,monospace" font-size="15">
      <text x="818" y="178">Given an array of integers nums</text><text x="818" y="208">and a target, return indices.</text>
      <text x="818" y="276">Example: nums = [2, 7, 11, 15]</text><text x="818" y="306">Output: [0, 1]</text>
      <text x="818" y="374">Write, run, and submit code.</text>
    </g>
  </g>
