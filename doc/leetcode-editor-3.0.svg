      <g class="step-one" font-family="Arial,sans-serif" font-size="12"><text x="83" y="132" fill="#aeb7c2">S</text><text x="135" y="132" fill="#aeb7c2">Title</text><text x="247" y="132" fill="#aeb7c2">AC</text><text x="299" y="132" fill="#aeb7c2">D</text><rect x="63" y="145" width="318" height="19" fill="#295a9f"/><text x="72" y="159" fill="#e2e8f0">[1] Two Sum</text><text x="247" y="159" fill="#d6deea">50.0%</text><text x="299" y="159" fill="#70c77a">Easy</text><text x="72" y="178" fill="#c9d0d9">[15] 3Sum</text><text x="247" y="178" fill="#c9d0d9">50.0%</text><text x="299" y="178" fill="#e6a33d">Medium</text><text x="72" y="197" fill="#c9d0d9">[49] Group Anagrams</text><text x="247" y="197" fill="#c9d0d9">50.0%</text><text x="299" y="197" fill="#e6a33d">Medium</text><text x="72" y="216" fill="#c9d0d9">[206] Reverse Linked List</text><text x="247" y="216" fill="#c9d0d9">50.0%</text><text x="299" y="216" fill="#70c77a">Easy</text></g>
      <rect x="386" y="53" width="786" height="433" fill="#1e1f22"/><rect x="386" y="53" width="786" height="32" fill="#292d32"/><rect x="400" y="60" width="80" height="20" rx="4" fill="#25292e" stroke="#4a5159"/><text x="408" y="75" fill="#d0d8e2" font-family="Arial,sans-serif" font-size="12">1 Two Sum</text>
      <rect x="386" y="85" width="786" height="31" fill="#202327"/><rect x="398" y="91" width="49" height="21" rx="4" fill="#315a91"/><text x="405" y="105" fill="#e5edf8" font-family="Arial,sans-serif" font-size="11">Content</text><text x="460" y="105" fill="#c1c9d2" font-family="Arial,sans-serif" font-size="11">Solution</text><text x="518" y="105" fill="#c1c9d2" font-family="Arial,sans-serif" font-size="11">Submissions</text><text x="603" y="105" fill="#c1c9d2" font-family="Arial,sans-serif" font-size="11">Note</text>
      <line x1="706" y1="116" x2="706" y2="486" stroke="#34373b"/><g font-family="Arial,sans-serif"><text x="412" y="151" fill="#e6edf5" font-size="18" font-weight="700">1. Two Sum</text><rect x="412" y="163" width="42" height="19" rx="9" fill="#295c37"/><text x="422" y="177" fill="#8cdb96" font-size="11">Easy</text><text x="468" y="177" fill="#aeb8c3" font-size="12">Array  ·  Hash Table</text><text x="412" y="218" fill="#c9d0d9" font-size="13">Given nums and a target, return the indices</text><text x="412" y="241" fill="#c9d0d9" font-size="13">of the two numbers that add up to target.</text><text x="412" y="285" fill="#e8edf3" font-size="14" font-weight="700">Example</text><rect x="412" y="297" width="266" height="72" rx="4" fill="#282b30"/><text x="425" y="320" fill="#c9d0d9" font-family="monospace" font-size="12">nums = [2,7,11,15]</text><text x="425" y="344" fill="#c9d0d9" font-family="monospace" font-size="12">target = 9</text></g>
      <g font-family="monospace" font-size="12"><text x="723" y="143" fill="#737b86">1</text><text x="746" y="143" fill="#85909d">// @leetcode submit region begin</text><g class="typed-code"><text x="723" y="166" fill="#737b86">2</text><text x="746" y="166" fill="#c886e8">import</text><text x="788" y="166" fill="#d7dee8"> java.util.*;</text><text x="723" y="185" fill="#737b86">3</text><text x="746" y="185" fill="#c886e8">class</text><text x="786" y="185" fill="#d7dee8"> Solution {</text><text x="723" y="204" fill="#737b86">4</text><text x="746" y="204" fill="#5db4f5">  public int[]</text><text x="839" y="204" fill="#d7dee8"> twoSum(int[] nums, int target) {</text><text x="723" y="223" fill="#737b86">5</text><text x="746" y="223" fill="#c886e8">    Map&lt;Integer, Integer&gt;</text><text x="907" y="223" fill="#d7dee8"> seen = new HashMap&lt;&gt;();</text><text x="723" y="242" fill="#737b86">6</text><text x="746" y="242" fill="#c886e8">    for</text><text x="770" y="242" fill="#d7dee8"> (int i = 0; i &lt; nums.length; i++) {</text><text x="723" y="261" fill="#737b86">7</text><text x="746" y="261" fill="#5db4f5">      int</text><text x="771" y="261" fill="#d7dee8"> need = target - nums[i];</text><text x="723" y="280" fill="#737b86">8</text><text x="746" y="280" fill="#c886e8">      if</text><text x="764" y="280" fill="#d7dee8"> (seen.containsKey(need)) {</text><text x="723" y="299" fill="#737b86">9</text><text x="746" y="299" fill="#c886e8">        return</text><text x="788" y="299" fill="#d7dee8"> new int[] { seen.get(need), i };</text><text x="715" y="318" fill="#737b86">10</text><text x="746" y="318" fill="#d7dee8">      }</text><text x="715" y="337" fill="#737b86">11</text><text x="746" y="337" fill="#d7dee8">      seen.put(nums[i], i);</text><text x="715" y="356" fill="#737b86">12</text><text x="746" y="356" fill="#d7dee8">    }</text><text x="715" y="375" fill="#737b86">13</text><text x="746" y="375" fill="#c886e8">    return</text><text x="788" y="375" fill="#d7dee8"> new int[0];</text><text x="715" y="394" fill="#737b86">14</text><text x="746" y="394" fill="#d7dee8">  }</text><text x="715" y="413" fill="#737b86">15</text><text x="746" y="413" fill="#d7dee8">}</text><rect x="746" y="397" width="7" height="16" fill="#efc461"/></g></g>
      <g class="write-focus"><rect x="715" y="126" width="438" height="299" rx="5" fill="none" stroke="#a774e6" stroke-width="2"/><rect x="722" y="103" width="104" height="20" rx="10" fill="#5b367d"/><text x="740" y="117" fill="#f1e8ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">2  Write code</text></g>
