<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">LeetCode Editor workflow</title>
  <desc id="description">A four-step LeetCode Editor workflow: open a problem, write code, run a local test case, then submit and review the result.</desc>
