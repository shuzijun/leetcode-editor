      </g>
    </symbol>
    <style>
      .step-one { animation: step-one 16s ease-in-out infinite; }
      .step-two { animation: step-two 16s ease-in-out infinite; }
      .step-three { animation: step-three 16s ease-in-out infinite; }
      .step-four { animation: step-four 16s ease-in-out infinite; }
      .write-focus { animation: write-focus 16s ease-in-out infinite; }
      .step-label-two { animation: step-label-two 16s ease-in-out infinite; }
      .action-menu { animation: action-menu 16s ease-in-out infinite; }
      .menu-step-three { animation: menu-step-three 16s ease-in-out infinite; }
      .typed-code { animation: typed-code 16s steps(1,end) infinite; }
      .result { animation: result 16s ease-in-out infinite; }
      @keyframes step-one { 0%,2% { opacity:0; } 4%,21% { opacity:1; } 23%,100% { opacity:.34; } }
      @keyframes step-two { 0%,27% { opacity:0; } 29%,46% { opacity:1; } 48%,100% { opacity:0; } }
      @keyframes step-three { 0%,52% { opacity:0; } 54%,71% { opacity:1; } 73%,100% { opacity:.34; } }
      @keyframes step-four { 0%,77% { opacity:0; } 79%,96% { opacity:1; } 98%,100% { opacity:0; } }
      @keyframes write-focus { 0%,27% { opacity:0; } 29%,46% { opacity:1; } 48%,100% { opacity:0; } }
      @keyframes step-label-two { 0%,27% { opacity:0; } 29%,46% { opacity:1; } 48%,100% { opacity:.34; } }
      @keyframes action-menu { 0%,52% { opacity:0; } 54%,96% { opacity:1; } 98%,100% { opacity:0; } }
      @keyframes menu-step-three { 0%,52% { opacity:0; } 54%,71% { opacity:1; } 73%,100% { opacity:0; } }
      @keyframes typed-code { 0%,28% { opacity:0; } 30%,34% { opacity:.45; } 36%,96% { opacity:1; } 98%,100% { opacity:0; } }
      @keyframes result { 0%,79% { opacity:0; } 81%,96% { opacity:1; } 98%,100% { opacity:0; } }
      @media (prefers-reduced-motion:reduce) { .step-one,.step-two,.step-three,.step-four,.write-focus,.step-label-two,.action-menu,.menu-step-three,.typed-code,.result { animation:none; } }
    </style>
