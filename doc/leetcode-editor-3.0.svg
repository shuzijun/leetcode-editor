      <rect x="59" y="486" width="1113" height="112" fill="#1d1f22" stroke="#303338"/><text x="70" y="507" fill="#d1d9e2" font-family="Arial,sans-serif" font-size="12" font-weight="700">LeetCode Console</text><text x="72" y="535" fill="#d59c43" font-family="monospace" font-size="12">›  2026/08/01 00:00:00</text><text class="result" x="72" y="557" fill="#72c878" font-family="monospace" font-size="12">✓ Accepted</text><text class="result" x="72" y="579" fill="#d7dee8" font-family="monospace" font-size="12">Runtime: 1 ms, faster than 50.00% of Java online submissions.</text>
